<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Advanced Physics</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('advphys-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>

<header id="top">
  <div class="brand"><img src="icons/icon-192.png" alt=""><div><b>Advanced Physics</b><span id="meets">Block 3</span></div></div>
  <span class="pill" id="netpill"><span class="dot"></span><span id="nettext">Checking&hellip;</span></span>
  <button class="iconbtn" id="themebtn" aria-label="Night mode" title="Night mode">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div id="searchbar">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  <input id="search" type="search" placeholder="Search lessons and topics" autocomplete="off" spellcheck="false">
</div>

<main id="view"><p class="muted center" style="padding:40px 0">Loading&hellip;</p></main>

<nav id="tabs">
  <button data-tab="schedule"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
  <button data-tab="labs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7 15h10"/></svg>Labs</button>
  <button data-tab="ref"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h11"/></svg>Reference</button>
</nav>

<div id="viewer" hidden>
  <div id="vbar">
    <button class="iconbtn" id="vback" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span id="vtitle"></span>
    <button class="iconbtn" id="vpresent" aria-label="Present (full screen)" title="Present (full screen)  F" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <a class="iconbtn" id="vopen" target="_blank" rel="noopener" aria-label="Open in a new tab" title="Open in a new tab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
  </div>
  <div id="vseg" hidden></div>
  <div id="vframes"></div>
</div>

<div id="toast"><span id="toastmsg"></span><button id="toastbtn">Reload</button></div>

<script src="app.js"></script>
</body>
</html>
